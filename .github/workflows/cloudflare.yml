name: Mews checks and optional demo deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_demo:
        description: Deploy this tested feature branch to dedicated synthetic D1/R2 resources
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app and check TypeScript
        run: npm run build

      - name: Verify synthetic data and role boundaries
        run: npm test

      - name: Build Storybook
        run: npm run build-storybook

      - name: Check Worker bundle
        run: npx --yes wrangler@4.158.0 deploy --dry-run

      - name: Deploy dedicated synthetic demo
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_demo && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEWS_DEMO_USERS_JSON: ${{ secrets.MEWS_DEMO_USERS_JSON }}
          MEWS_OPENAI_API_KEY: ${{ secrets.MEWS_OPENAI_API_KEY }}
          MEWS_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.MEWS_GOOGLE_MAPS_BROWSER_KEY }}
        run: node dev/deploy-demo.mjs
